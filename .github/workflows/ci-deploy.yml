name: CI and Deploy Docker Image

on:
  push:
    branches: [ main ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: |
          pytest -q

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          # Accept multiple possible secret names to be flexible for users.
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME || github.actor }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/trainer-bot-2:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/trainer-bot-2:${{ github.sha }}
