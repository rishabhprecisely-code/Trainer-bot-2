name: CI and Deploy Docker Image

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

# Allow the workflow to push to GitHub Container Registry using the
# automatically provided GITHUB_TOKEN without external secrets.
permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: |
          pytest -q

  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: test
    if: needs.test.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image (manual)
        run: |
          set -euo pipefail
          echo "Building image..."
          docker build -t ghcr.io/${{ github.repository_owner }}/trainer-bot-2:latest \
            -t ghcr.io/${{ github.repository_owner }}/trainer-bot-2:${{ github.sha }} . 2>&1 | tee /tmp/docker-build.log

      - name: Push Docker images to GHCR (manual)
        run: |
          set -euo pipefail
          echo "Pushing latest tag..."
          docker push ghcr.io/${{ github.repository_owner }}/trainer-bot-2:latest 2>&1 | tee /tmp/docker-push-latest.log || true
          echo "Pushing sha tag..."
          docker push ghcr.io/${{ github.repository_owner }}/trainer-bot-2:${{ github.sha }} 2>&1 | tee /tmp/docker-push-sha.log || true

      - name: List local Docker images (debug)
        run: |
          docker images --format '{{json .}}' > /tmp/docker-images.json || true

      - name: Upload build diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.run_number }}
          path: |
            /tmp/docker-build.log
            /tmp/docker-push-latest.log
            /tmp/docker-push-sha.log
            /tmp/docker-images.json

    smoke-test:
      name: Runtime smoke test (runs container on runner)
      runs-on: ubuntu-latest
      needs: build-and-push
      if: needs.build-and-push.result == 'success'
      steps:
        - name: Log in to GHCR
          uses: docker/login-action@v2
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Pull image
          run: |
            docker pull ghcr.io/${{ github.repository_owner }}/trainer-bot-2:latest

        - name: Run container (smoke)
          env:
            TOKEN: ${{ secrets.TOKEN }}
            START_DISCORD_BOT: false
          run: |
            docker run -d --name trainer-smoke \
              -e START_DISCORD_BOT=${START_DISCORD_BOT} -e TOKEN=${TOKEN} \
              ghcr.io/${{ github.repository_owner }}/trainer-bot-2:latest || true

            # Wait for the container to be healthy/ready by polling the internal /status endpoint
            ATTEMPTS=0
            MAX_ATTEMPTS=12
            SLEEP=5
            until [ $ATTEMPTS -ge $MAX_ATTEMPTS ]; do
              if docker exec trainer-smoke curl -sS --fail http://127.0.0.1:8080/status > /tmp/status.json 2>/tmp/curl.err; then
                echo "Smoke test passed. /status returned:" && cat /tmp/status.json
                break
              else
                echo "Attempt $((ATTEMPTS+1)) failed. Curl output:" && cat /tmp/curl.err || true
                ATTEMPTS=$((ATTEMPTS+1))
                sleep $SLEEP
              fi
            done

            if [ $ATTEMPTS -ge $MAX_ATTEMPTS ]; then
              echo "Smoke test failed; dumping container logs:" && docker logs trainer-smoke || true
              docker logs trainer-smoke > /tmp/trainer-smoke.log || true
              docker rm -f trainer-smoke || true
              echo "Uploading smoke-test artifacts"
              ls -la /tmp || true
              cat /tmp/trainer-smoke.log || true
              exit 1
            fi
            docker logs trainer-smoke > /tmp/trainer-smoke.log || true
            docker rm -f trainer-smoke || true
        - name: Upload smoke-test artifacts
          uses: actions/upload-artifact@v4
          with:
            name: smoke-test-artifacts-${{ github.run_number }}
            path: |
              /tmp/status.json
              /tmp/trainer-smoke.log
