name: CI and Deploy Docker Image

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

# Allow the workflow to push to GitHub Container Registry using the
# automatically provided GITHUB_TOKEN without external secrets.
permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: |
          pytest -q

  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: test
    if: needs.test.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/trainer-bot-2:latest
            ghcr.io/${{ github.repository_owner }}/trainer-bot-2:${{ github.sha }}

    smoke-test:
      name: Runtime smoke test (runs container on runner)
      runs-on: ubuntu-latest
      needs: build-and-push
      if: needs.build-and-push.result == 'success'
      steps:
        - name: Log in to GHCR
          uses: docker/login-action@v2
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Pull image
          run: |
            docker pull ghcr.io/${{ github.repository_owner }}/trainer-bot-2:latest

        - name: Run container (smoke)
          env:
            TOKEN: ${{ secrets.TOKEN }}
            START_DISCORD_BOT: false
          run: |
            docker run -d --name trainer-smoke -p 8080:8080 \
              -e START_DISCORD_BOT=${START_DISCORD_BOT} -e TOKEN=${TOKEN} \
              ghcr.io/${{ github.repository_owner }}/trainer-bot-2:latest || true
            sleep 5
            curl -v --fail http://127.0.0.1:8080/status || (docker logs trainer-smoke && exit 1)
            docker rm -f trainer-smoke || true
